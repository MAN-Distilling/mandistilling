backend:
  name: git-gateway
  branch: main
publish_mode: editorial_workflow
media_folder: images
public_folder: /images
custom_css: /admin/custom.css
custom_js: /admin/custom.js
collections:
  - name: entries
    label: Entries
    folder: _entries
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ['date', 'title']
    media_folder: /images/entries
    public_folder: /images/entries
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: MMMM D YYYY HH:mm, date_format: MMMM D YYYY, time_format: true, hint: "Pick the date and time. Time is only used to sort same-day posts correctly — the site still displays just the date." }
      - label: Type
        name: type
        widget: select
        options: [projects, thoughts]
      - label: Subtypes
        name: subtypes
        widget: select
        multiple: true
        options: [Moving, Making, Fixing, Seeing, Recording, Experimenting, Stories, Wool, Leather, Wood, Stone, Air, Paint, Nature, Humans, Society, Building, Breaking, Work, Play, Heart, Mind, Landscape, People, Travel, Detail, Urban, Abstract]
      - { label: Body, name: body, widget: text, hint: "The full text of the post. Use [img:0], [img:1] etc to place peephole images inline." }
      - { label: Excerpt, name: excerpt, widget: text, required: false, hint: "Leave blank to auto-pull the first 3 lines from Body." }
      - { label: Main Image, name: image, widget: image, required: false }
      - label: Additional Images (for peepholes)
        name: images
        widget: list
        required: false
        fields:
          - { label: Image, name: image, widget: image }
          - label: Peephole Position
            name: focus
            widget: select
            default: center
            hint: "Which part of the image shows through the small peephole window in the text. Only affects the tiny inline preview — clicking it still opens the full image."
            options: [top left, top center, top right, center left, center, center right, bottom left, bottom center, bottom right]
      - { label: YouTube URL, name: youtube, widget: string, required: false }
      - { label: "Order (Art wall position — 1 is first)", name: order, widget: number, required: false, value_type: float }

  - name: places
    label: Places
    folder: _places
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    media_folder: /images/places
    public_folder: /images/places
    fields:
      - { label: Title, name: title, widget: string, required: false }
      - { label: Latitude, name: lat, widget: number, value_type: float }
      - { label: Longitude, name: lng, widget: number, value_type: float }
      - { label: Date, name: date, widget: datetime, format: MMMM D YYYY, date_format: MMMM D YYYY, time_format: false, required: false, hint: "Pick the date. Displays as e.g. June 20 2026." }
      - { label: Note, name: note, widget: text, required: false }
      - label: Pin Colour
        name: color
        widget: select
        required: false
        default: "#6aab8a"
        options: ["#6aab8a","#d4a830","#c0573a","#5b8fa0","#8a7ab0","#a8bfb0","#e8ede9"]
      - label: Pin Shape
        name: shape
        widget: select
        required: false
        default: circle
        options: [circle, diamond, star, cross]
      - { label: Related post title, name: postTitle, widget: string, required: false }
      - label: Images
        name: images
        widget: list
        required: false
        field: { label: Image, name: image, widget: image }

  - name: photos
    label: Photos
    folder: _photos
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{uuid}}"
    media_folder: /images/photos
    public_folder: /images/photos
    fields:
      - { label: Image, name: image, widget: image, hint: "The only required field — everything else below is optional." }
      - { label: Title, name: title, widget: string, required: false }
      - { label: Date, name: date, widget: datetime, format: MMMM D YYYY, date_format: MMMM D YYYY, time_format: false, required: false }
      - { label: Gallery Filter Category, name: category, widget: select, required: false, options: [Landscape, People, Travel, Detail, Urban, Nature, Abstract], hint: "Optional — organizes this photo within the gallery's filter if set." }
      - { label: Description, name: description, widget: text, required: false }

  - name: art
    label: Art
    folder: _art
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ['order', 'date', 'title']
    media_folder: /images/art
    public_folder: /images/art
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: MMMM D YYYY, date_format: MMMM D YYYY, time_format: false, hint: "Pick the date. Displays as e.g. June 20 2026." }
      - label: Medium
        name: medium
        widget: select
        multiple: true
        options: [Wool, Leather, Wood, Stone, Air, Paint, Silicon Hallucinations]
      - { label: Body, name: body, widget: text }
      - label: Images
        name: images
        widget: list
        required: true
        min: 1
        hint: "At least one image is required. Add more to let people page through them on the piece's lightbox."
        fields:
          - { label: Image, name: image, widget: image }
      - { label: Sold, name: sold, widget: boolean, default: false, required: false }
      - { label: Visible, name: visible, widget: boolean, default: true, required: false, hint: "Turn off to hide this piece from the Art page without deleting it." }
      - { label: Buy Link, name: buylink, widget: string, required: false, hint: "Leave blank to show a 'Contact for details' button instead of a working link." }
      - { label: "Order (Art wall position — 1 is first)", name: order, widget: number, required: false, value_type: float }

  - name: words
    label: Words
    folder: _words
    create: true
    slug: "{{slug}}"
    identifier_field: word
    media_folder: /images/words
    public_folder: /images/words
    fields:
      - { label: Word, name: word, widget: string, hint: "FILL THIS IN FIRST, before anything else on this page — the filename gets locked in from whatever's typed at the very start, and never updates again. The headword exactly as it will appear. For the Words Within Words category, wrap the part(s) that should show green in curly braces — e.g. {man}ipul{ate}. Only the braced part(s) will render green; everything else stays white. Braces themselves are not shown." }
      - { label: Date, name: date, widget: datetime, format: MMMM D YYYY, date_format: MMMM D YYYY, time_format: false, required: false, hint: "For Coined words: when it was first used. For Erased words: when it started falling out of use. Shown on the page as 'Manifested on:' for Coined/Words Within Words, or 'Fading since:' for Erased categories. Does not affect the random scatter order." }
      - { label: Visual Word Image, name: image, widget: image, required: false, hint: "Optional — upload an image of the word if it has a visual/typographic form. Replaces the text headword on the scatter page." }
      - { label: Pronunciation, name: pronunciation, widget: string, hint: "e.g. won-CLAR-ity" }
      - { label: Word Type, name: wordtype, widget: string, hint: "e.g. noun — from Latin..." }
      - label: Category
        name: category
        widget: select
        default: Coined
        options:
          - Coined
          - Words Within Words
          - Erased by Technology
          - Erased by Political Flattening
          - Erased by Speed
          - Erased by Commerce
          - Erased from Personal Sovereignty
          - Erased from Inner Life
          - Erased from the Commons
      - { label: Definition, name: definition, widget: text }
      - { label: Mechanism of Loss, name: mechanism, widget: text, required: false, hint: "Why it disappeared. Leave blank for coined words." }

  - name: books
    label: Books
    folder: _books
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Author, name: author, widget: string }
      - label: Status
        name: status
        widget: select
        default: read
        options: [reading, read, recommend]
      - label: Genre
        name: genre
        widget: select
        default: Fiction
        options:
          - Fiction
          - Philosophy
          - Poetry
          - Science Fiction
          - Psychology & Mind
          - Self-Development
          - Spirituality & Religion
          - History & Politics
          - Finance & Economics
          - Metaphysics & Occult
          - Biography & Memoir
          - Science
          - Fantasy & Mythology
          - Drama & Theatre
          - Nature & Outdoors
          - Law & Ethics
          - Children & YA
          - Graphic Novel & Comics
      - { label: "Rating (0-5)", name: rating, widget: number, required: false, value_type: int, min: 0, max: 5 }
      - { label: Notes, name: notes, widget: text, required: false }

  - name: quotes
    label: Quotes
    folder: _quotes
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{title}}"
    identifier_field: title
    fields:
      - { label: "Title (internal — for CMS list only, not shown on site. Keep it short.)", name: title, widget: string, hint: "Short label for finding this quote in the CMS list. Never displayed on the site." }
      - { label: Quote, name: quote, widget: text, hint: "The full quote text. Use [like this] for gold emphasis, {like this} for green emphasis." }
      - { label: Description, name: description, widget: text, required: false, hint: "Optional — a subtle explanation shown below the quote when someone clicks it open. Plain text only." }
      - { label: "My own quote (shows in gold — uncheck for someone else's in white)", name: mine, widget: boolean, default: true, required: false }
      - { label: Author, name: author, widget: string, required: false, hint: "Leave blank if this is your own. For others: their name e.g. Marcus Aurelius." }
      - { label: Source, name: source, widget: string, required: false, hint: "e.g. Meditations, or a conversation, or a letter. Leave blank if unknown." }
      - { label: "First uttered on", name: date, widget: datetime, format: MMMM D YYYY, date_format: MMMM D YYYY, time_format: false, required: false, hint: "Optional — for your own quotes, when you first said it." }
      - label: "On"
        name: category
        widget: select
        required: false
        options: [Life, Love, Moving Forward, Moving Backward, People, Society, Nature, Earth, Mind, Work]
      - { label: Visible, name: visible, widget: boolean, default: true, required: false, hint: "Turn off to hide this quote without deleting it." }

  - name: links
    label: Links
    folder: _links
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ['order', 'name']
    media_folder: /images/links
    public_folder: /images/links
    fields:
      - label: Platform
        name: platform
        widget: select
        options: [YouTube, Instagram, Rumble, Substack, Patreon, "Buy Me a Coffee", Bluesky, Mastodon, Threads, Gab, MeWe, BitChute, Brighteon, Odysee, GanjingWorld, Etsy, Custom]
        hint: "Pick a known platform to use its built-in icon and color automatically. Pick Custom to upload your own icon and set your own color below."
      - { label: Name, name: name, widget: string, hint: "The name shown on the card. Feel free to edit even for a known platform." }
      - { label: Handle, name: handle, widget: string, required: false, hint: "e.g. @MAN.Distilling" }
      - { label: URL, name: url, widget: string, hint: "The link this card opens." }
      - { label: Custom Icon, name: customicon, widget: image, required: false, hint: "Only used when Platform is set to Custom. Gets auto-cropped to a square to match the built-in icons." }
      - { label: Custom Color, name: customcolor, widget: string, required: false, hint: "Only used when Platform is set to Custom. Hex code for the background wash behind the icon, e.g. #6aab8a." }
      - { label: Visible, name: visible, widget: boolean, default: true, required: false, hint: "Turn off to remove this link from the site entirely — the other links keep their order." }
      - { label: "Order (1 is first — new links default to the top until you set this)", name: order, widget: number, required: false, value_type: float }

  - name: bio
    label: Bio
    files:
      - name: bio
        label: Bio Page
        file: _bio/bio.md
        fields:
          - label: Past
            name: past
            widget: markdown
            hint: "The Past section. Supports bold (**word**) and italic (*word*) formatting. Each blank line creates a new paragraph."
          - label: Present
            name: present
            widget: markdown
            hint: "The Present section. Supports bold (**word**) and italic (*word*) formatting. Each blank line creates a new paragraph."
          - label: Future
            name: future
            widget: markdown
            hint: "The Future section. Supports bold (**word**) and italic (*word*) formatting. Each blank line creates a new paragraph."

  - name: colophon
    label: Colophon
    files:
      - name: colophon
        label: Colophon Page
        file: _colophon/colophon.md
        fields:
          - label: Body
            name: body
            widget: markdown
            hint: "The full colophon text. Supports bold (**word**) and italic (*word*) formatting. Each blank line creates a new paragraph."
