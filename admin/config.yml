backend:
  name: git-gateway
  branch: main
media_folder: images
public_folder: /images
custom_css: /admin/custom.css
custom_js: /admin/custom.js
collections:
  - name: entries
    label: Entries
    folder: _entries
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ['date', 'title']
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: MMMM D YYYY, date_format: MMMM D YYYY, time_format: false, hint: "Pick the date. Displays as e.g. June 20 2026." }
      - label: Type
        name: type
        widget: select
        options: [projects, thoughts, art, photo]
      - label: Subtypes
        name: subtypes
        widget: select
        multiple: true
        options: [Moving, Making, Fixing, Seeing, Recording, Experimenting, Stories, Wool, Leather, Wood, Stone, Air, Paint, Nature, Humans, Society, Building, Breaking, Work, Play, Heart, Mind, Landscape, People, Travel, Detail, Urban, Abstract]
      - { label: Body, name: body, widget: text, hint: "The full text of the post. Use [img:0], [img:1] etc to place peephole images inline." }
      - { label: Excerpt, name: excerpt, widget: text, required: false, hint: "Leave blank to auto-pull the first 3 lines from Body." }
      - { label: Main Image, name: image, widget: image, required: false }
      - label: Additional Images (for peepholes)
        name: images
        widget: list
        required: false
        fields:
          - { label: Image, name: image, widget: image }
          - label: Peephole Position
            name: focus
            widget: select
            default: center
            hint: "Which part of the image shows through the small peephole window in the text. Only affects the tiny inline preview — clicking it still opens the full image."
            options: [top left, top center, top right, center left, center, center right, bottom left, bottom center, bottom right]
      - { label: YouTube URL, name: youtube, widget: string, required: false }
      - { label: "Order (Art wall position — 1 is first)", name: order, widget: number, required: false, value_type: float }
  - name: places
    label: Places
    folder: _places
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Title, name: title, widget: string, required: false }
      - { label: Latitude, name: lat, widget: number, value_type: float }
      - { label: Longitude, name: lng, widget: number, value_type: float }
      - { label: Date, name: date, widget: datetime, format: MMMM D YYYY, date_format: MMMM D YYYY, time_format: false, required: false, hint: "Pick the date. Displays as e.g. June 20 2026." }
      - { label: Note, name: note, widget: text, required: false }
      - label: Pin Colour
        name: color
        widget: select
        required: false
        default: "#6aab8a"
        options: ["#6aab8a","#d4a830","#c0573a","#5b8fa0","#8a7ab0","#a8bfb0","#e8ede9"]
      - label: Pin Shape
        name: shape
        widget: select
        required: false
        default: circle
        options: [circle, diamond, star, cross]
      - { label: Related post title, name: postTitle, widget: string, required: false }
      - label: Images
        name: images
        widget: list
        required: false
        field: { label: Image, name: image, widget: image }
  - name: words
    label: Words
    folder: _words
    create: true
    slug: "{{slug}}"
    identifier_field: word
    fields:
      - { label: Word, name: word, widget: string, hint: "The headword exactly as it will appear. For the Words Within Words category, wrap the part(s) that should show green in curly braces — e.g. {man}ipul{ate}. Only the braced part(s) will render green; everything else stays white. Braces themselves are not shown." }
      - { label: Date, name: date, widget: datetime, format: MMMM D YYYY, date_format: MMMM D YYYY, time_format: false, required: false, hint: "For Coined words: when it was first used. For Erased words: when it started falling out of use. Shown on the page as 'Manifested on:' for Coined/Words Within Words, or 'Fading since:' for Erased categories. Does not affect the random scatter order." }
      - { label: Visual Word Image, name: image, widget: image, required: false, hint: "Optional — upload an image of the word if it has a visual/typographic form. Replaces the text headword on the scatter page." }
      - { label: Pronunciation, name: pronunciation, widget: string, hint: "e.g. won-CLAR-ity" }
      - { label: Word Type, name: wordtype, widget: string, hint: "e.g. noun — from Latin..." }
      - label: Category
        name: category
        widget: select
        default: Coined
        options:
          - Coined
          - Words Within Words
          - Erased by Technology
          - Erased by Political Flattening
          - Erased by Speed
          - Erased by Commerce
          - Erased from Personal Sovereignty
          - Erased from Inner Life
          - Erased from the Commons
      - { label: Definition, name: definition, widget: text }
      - { label: Mechanism of Loss, name: mechanism, widget: text, required: false, hint: "Why it disappeared. Leave blank for coined words." }
  - name: books
    label: Books
    folder: _books
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Author, name: author, widget: string }
      - label: Status
        name: status
        widget: select
        default: read
        options: [reading, read, recommend]
      - label: Genre
        name: genre
        widget: select
        default: Fiction
        options:
          - Fiction
          - Philosophy
          - Poetry
          - Science Fiction
          - Psychology & Mind
          - Self-Development
          - Spirituality & Religion
          - History & Politics
          - Finance & Economics
          - Metaphysics & Occult
          - Biography & Memoir
          - Science
          - Fantasy & Mythology
          - Drama & Theatre
          - Nature & Outdoors
          - Law & Ethics
          - Children & YA
          - Graphic Novel & Comics
      - { label: "Rating (0-5)", name: rating, widget: number, required: false, value_type: int, min: 0, max: 5 }
      - { label: Notes, name: notes, widget: text, required: false }
